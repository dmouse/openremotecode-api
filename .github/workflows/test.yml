name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: opencode_remote
          POSTGRES_USER: opencode_remote
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencode_remote -d opencode_remote"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CGO_ENABLED: "1"
      DATABASE_TEST_URL: postgres://opencode_remote:local-development-only@localhost:5432/opencode_remote?sslmode=disable

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Integration tests
        run: go test -race -tags=integration ./...
